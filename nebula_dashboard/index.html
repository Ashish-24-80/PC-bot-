<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula OS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ff00ff;
            --accent-glow: rgba(255, 0, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: url('/static/images/bg.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            height: 80vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: grid;
            grid-template-columns: 250px 1fr;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }

        /* Sidebar */
        .sidebar {
            border-right: 1px solid var(--glass-border);
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            color: rgba(255,255,255,0.6);
        }

        .nav-item.active {
            background: var(--glass-bg);
            color: white;
            border: 1px solid var(--glass-border);
        }

        /* Main Content */
        .main {
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card h3 {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 32px;
            font-weight: 600;
        }

        .chart-container {
            margin-top: 30px;
            height: 250px;
            width: 100%;
        }

        /* Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--accent-glow); }
            70% { box-shadow: 0 0 0 15px rgba(255,0,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,0,255,0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">NEBULA OS</div>
            <div class="nav-item active">Dashboard</div>
            <div class="nav-item">Processes</div>
            <div class="nav-item">Settings</div>
            
            <div style="margin-top: auto; padding: 20px; font-size: 12px; color: rgba(255,255,255,0.3);">
                System: {{ sys.os }}<br>
                Node: {{ sys.node }}
            </div>
        </div>
        <div class="main">
            <div class="header">
                <h1>Welcome, Agent SUBU</h1>
                <div style="font-size: 14px; color: rgba(255,255,255,0.5);">Current Node Time: <span id="time"></span></div>
            </div>

            <div class="stats-grid">
                <div class="card">
                    <h3>CPU USAGE</h3>
                    <div class="value" id="cpu-val">0%</div>
                </div>
                <div class="card">
                    <h3>RAM USAGE</h3>
                    <div class="value" id="ram-val">0%</div>
                </div>
                <div class="card">
                    <h3>DISK SPACE</h3>
                    <div class="value" id="disk-val">0%</div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="sysChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Update Time
        setInterval(() => {
            document.getElementById('time').innerText = new Date().toLocaleTimeString();
        }, 1000);

        // Chart.js initialization
        const ctx = document.getElementById('sysChart').getContext('2d');
        const sysChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(10).fill(''),
                datasets: [{
                    label: 'CPU Usage (%)',
                    data: [],
                    borderColor: '#ff00ff',
                    backgroundColor: 'rgba(255, 0, 255, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 100, grid: { display: false } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // Fetch Stats
        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('cpu-val').innerText = data.cpu + '%';
                document.getElementById('ram-val').innerText = data.ram + '%';
                document.getElementById('disk-val').innerText = data.disk + '%';

                // Update Chart
                sysChart.data.datasets[0].data.push(data.cpu);
                if (sysChart.data.datasets[0].data.length > 10) {
                    sysChart.data.datasets[0].data.shift();
                }
                sysChart.update();
            } catch (e) {
                console.error("Failed to fetch stats", e);
            }
        }

        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>
</html>
